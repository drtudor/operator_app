<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERATOR — Combat Fitness System</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b0d;--surface:#0d1419;--card:#111920;--border:#1a2830;--border-hi:#243540;--amber:#c8a84b;--amber-dim:#7a6528;--green:#3d9e72;--green-dim:#2a5e45;--blue:#5a96c8;--red:#c84b4b;--ruck:#b4703c;--text:#ddd5c0;--text-dim:#6e8590;--text-muted:#334050;--font-h:'Rajdhani','Arial Narrow',sans-serif;--font-m:'JetBrains Mono','Courier New',monospace;--font-c:'Barlow Condensed','Arial Narrow',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-h);display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,168,75,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(200,168,75,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border-hi);display:flex;z-index:100;}
.nb{flex:1;padding:10px 4px;background:none;border:none;color:var(--text-muted);font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;}
.nb.active{color:var(--amber);}
.nb svg{width:18px;height:18px;stroke-width:1.5;}
.page{display:none;padding:16px 16px 80px;position:relative;z-index:1;overflow-y:auto;flex:1;max-width:540px;margin:0 auto;width:100%;}
.page.active{display:block;}
h1{font-family:var(--font-h);font-size:28px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1;}
h2{font-family:var(--font-h);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.label{font-family:var(--font-m);font-size:9px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.phase-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,168,75,.08);border:1px solid var(--amber-dim);padding:3px 10px;font-family:var(--font-m);font-size:10px;letter-spacing:.12em;color:var(--amber);margin-bottom:6px;}
.phase-badge::before{content:'';width:5px;height:5px;background:var(--amber);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.card{background:var(--card);border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.prog-bar{background:var(--border);height:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--amber);transition:width .6s ease;}
.prog-fill.g{background:var(--green);}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sc{background:var(--surface);border:1px solid var(--border);padding:12px;}
.sv{font-family:var(--font-m);font-size:22px;color:var(--amber);}
.su{font-size:11px;color:var(--text-dim);}
.chip{display:inline-block;padding:2px 8px;font-family:var(--font-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.chip.upper,.chip.se_upper{background:rgba(200,168,75,.12);color:var(--amber);}
.chip.lower,.chip.se_lower{background:rgba(61,158,114,.12);color:var(--green);}
.chip.run{background:rgba(90,150,200,.12);color:var(--blue);}
.chip.ruck{background:rgba(180,112,60,.12);color:var(--ruck);}
.chip.rest,.chip.deload,.chip.missed{background:rgba(100,100,100,.1);color:var(--text-dim);}
.ex-list{margin-top:8px;}
.ex-hdr{display:grid;grid-template-columns:1fr 36px 46px 46px;gap:4px;padding:0 0 6px;border-bottom:1px solid var(--border-hi);}
.ex-hlabel{font-family:var(--font-m);font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;}
.ex-hlabel:first-child{text-align:left;}
.ex-row{display:grid;grid-template-columns:1fr 36px 46px 46px;gap:4px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border);}
.ex-row:last-child{border:none;}
.ex-name{font-size:14px;font-weight:600;line-height:1.3;}
.ex-note{font-size:10px;color:var(--text-dim);}
.ex-hist{font-family:var(--font-m);font-size:9px;color:var(--text-dim);margin-top:2px;}
.ex-prog{font-family:var(--font-m);font-size:9px;margin-top:2px;font-weight:500;}
.ex-d{font-family:var(--font-m);font-size:12px;color:var(--text-dim);text-align:center;padding-top:2px;}
.ex-d span{display:block;font-size:7px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
.run-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
.run-row:last-child{border:none;}
.run-val{font-family:var(--font-m);font-size:16px;color:var(--amber);}
.strava{background:var(--surface);border:1px solid var(--border-hi);border-left:3px solid var(--amber);padding:10px 12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.strava-text{font-family:var(--font-m);font-size:12px;}
.strava-copy{background:none;border:1px solid var(--border-hi);color:var(--text-dim);font-family:var(--font-m);font-size:9px;padding:4px 8px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .2s;}
.strava-copy:hover{border-color:var(--amber);color:var(--amber);}
.btn{width:100%;padding:13px;background:rgba(200,168,75,.08);border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--font-c);font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-top:10px;transition:all .2s;}
.btn:hover{background:rgba(200,168,75,.16);border-color:var(--amber);}
.btn.done{background:rgba(61,158,114,.1);border-color:var(--green-dim);color:var(--green);}
.btn.sec{background:rgba(255,255,255,.03);border-color:var(--border-hi);color:var(--text-dim);margin-top:6px;}
.btn.sec:hover{background:rgba(255,255,255,.06);}
.btn.miss{background:rgba(200,60,60,.06);border-color:rgba(200,60,60,.3);color:rgba(220,120,120,.8);margin-top:6px;}
.btn.miss:hover{background:rgba(200,60,60,.12);}
.phase-hdr{border-top:1px solid var(--border-hi);margin:18px 0 10px;padding-top:12px;display:flex;align-items:center;gap:10px;}
.phase-hdr-label{font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;}
.phase-hdr-sub{font-family:var(--font-m);font-size:10px;color:var(--text-muted);}
.week-hdr{font-family:var(--font-m);font-size:9px;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.day-row{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:2px;border:1px solid transparent;cursor:pointer;transition:all .15s;}
.day-row.today{border-color:var(--amber);background:rgba(200,168,75,.04);}
.day-row.done{opacity:.45;}
.day-row:hover{background:rgba(255,255,255,.02);}
.day-dot{width:7px;height:7px;border-radius:1px;flex-shrink:0;}
.dot-upper,.dot-se_upper{background:var(--amber);}
.dot-lower,.dot-se_lower{background:var(--green);}
.dot-run{background:var(--blue);}
.dot-ruck{background:var(--ruck);}
.dot-rest,.dot-deload{background:var(--border-hi);}
.day-num{font-family:var(--font-m);font-size:10px;color:var(--text-muted);width:22px;flex-shrink:0;}
.day-info{flex:1;}
.day-name{font-size:13px;font-weight:600;}
.day-det{font-family:var(--font-m);font-size:10px;color:var(--text-dim);}
.day-check{color:var(--green);font-size:12px;}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ig{display:flex;flex-direction:column;gap:4px;}
.if{background:var(--surface);border:1px solid var(--border-hi);color:var(--text);font-family:var(--font-m);font-size:16px;padding:10px;width:100%;outline:none;transition:border-color .2s;}
.if:focus{border-color:var(--amber);}
.if::placeholder{color:var(--text-muted);}
.if option{background:var(--surface);}
.btn-log{grid-column:1/-1;padding:12px;background:rgba(200,168,75,.08);border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-log:hover{background:rgba(200,168,75,.16);}
.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pb-card{background:var(--surface);border:1px solid var(--border);padding:12px;cursor:pointer;transition:border-color .2s;}
.pb-card:hover{border-color:var(--border-hi);}
.pb-dist{font-family:var(--font-m);font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.pb-time{font-family:var(--font-m);font-size:18px;color:var(--amber);}
.pb-unset{font-family:var(--font-m);font-size:12px;color:var(--text-muted);}
.log-list{max-height:150px;overflow-y:auto;}
.log-entry{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-family:var(--font-m);font-size:12px;}
.log-entry:last-child{border:none;}
.log-date{color:var(--text-muted);}
.notes-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);padding:10px 12px;margin-top:10px;font-size:13px;color:var(--text-dim);line-height:1.5;}
.missed-banner{background:rgba(200,60,60,.08);border:1px solid rgba(200,60,60,.25);border-left:3px solid rgba(200,60,60,.6);padding:10px 12px;margin-bottom:10px;font-family:var(--font-m);font-size:12px;color:rgba(220,130,130,.9);}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.badge{background:var(--surface);border:1px solid var(--border);padding:3px 8px;font-family:var(--font-m);font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.badge.active{border-color:var(--green-dim);color:var(--green);background:rgba(61,158,114,.07);}
.log-session-row{display:grid;grid-template-columns:1fr 60px 48px 40px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.log-session-row:last-child{border:none;}
.ls-name{font-size:12px;color:var(--text-dim);}
.ls-input{background:var(--bg);border:1px solid var(--border-hi);color:var(--text);font-family:var(--font-m);font-size:13px;padding:5px 6px;width:100%;outline:none;text-align:center;}
.ls-input:focus{border-color:var(--amber);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border-hi);}
</style>
</head>
<body>
<div id="pg-dash" class="page active"><div id="dash-content"></div></div>
<div id="pg-today" class="page"><div id="today-content"></div></div>
<div id="pg-plan" class="page"><div id="plan-content"></div></div>
<div id="pg-stats" class="page"><div id="stats-content"></div></div>
<nav>
  <button class="nb active" onclick="showPage('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</button>
  <button class="nb" onclick="showPage('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>Today</button>
  <button class="nb" onclick="showPage('plan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Plan</button>
  <button class="nb" onclick="showPage('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Stats</button>
</nav>
<script>
// ===== PLAN DATA =====
const EXERCISES={
  upper:[
    {name:'Pull Ups',sets:4,reps:'6-10',rest:'90s',note:'Assisted — reduce assist as strength builds'},
    {name:'DB Bench Press',sets:4,reps:'8-12',rest:'90s'},
    {name:'DB Incline Bench',sets:3,reps:'10-12',rest:'90s'},
    {name:'T-Bar Row',sets:4,reps:'8-10',rest:'90s'},
    {name:'Shoulder Press',sets:3,reps:'10-12',rest:'90s'},
    {name:'Lateral Raises',sets:3,reps:'15',rest:'60s'},
    {name:'Face Pulls',sets:3,reps:'15-20',rest:'60s'},
    {name:'Tricep Pushdown',sets:3,reps:'12',rest:'60s'},
    {name:'Tricep Extensions',sets:3,reps:'12',rest:'60s'},
  ],
  lower:[
    {name:'Deadlift',sets:4,reps:'5',rest:'3min',note:'Heavy — prioritise form'},
    {name:'Squat',sets:4,reps:'8',rest:'2min'},
    {name:'Walking Lunges',sets:3,reps:'10/leg',rest:'90s'},
    {name:'Back Extensions',sets:3,reps:'15',rest:'60s',note:'Glute focus'},
    {name:'Leg Curls',sets:3,reps:'12',rest:'60s'},
  ],
  se_upper:[
    {name:'Pull Ups',sets:5,reps:'10-15',rest:'60s'},
    {name:'DB Bench Press',sets:4,reps:'15',rest:'60s'},
    {name:'T-Bar Row',sets:4,reps:'15',rest:'60s'},
    {name:'Shoulder Press',sets:3,reps:'15',rest:'60s'},
    {name:'Face Pulls',sets:4,reps:'20',rest:'45s'},
    {name:'Lateral Raises',sets:3,reps:'15',rest:'45s'},
  ],
  se_lower:[
    {name:'Squat',sets:4,reps:'15',rest:'60s'},
    {name:'Walking Lunges',sets:4,reps:'15/leg',rest:'60s'},
    {name:'Back Extensions',sets:4,reps:'20',rest:'45s'},
    {name:'Leg Curls',sets:3,reps:'15',rest:'45s'},
    {name:'Step Ups',sets:3,reps:'15/leg',rest:'60s'},
  ],
};
const MUSCLES={upper:['Chest','Back','Shoulders','Triceps','Biceps*'],lower:['Quads','Hamstrings','Glutes','Lower Back'],se_upper:['Chest','Back','Shoulders'],se_lower:['Quads','Hamstrings','Glutes'],run:['Cardiovascular','Calves','Hip Flexors'],ruck:['Traps','Core','Glutes','Quads'],rest:[],deload:[]};
const SN={upper:'Upper Body',lower:'Lower Body',run:'Run',ruck:'Ruck March',rest:'Rest Day',deload:'Deload',se_upper:'SE — Upper Body',se_lower:'SE — Lower Body'};
const RTN={lss:'LSS Run',tempo:'Tempo Run',hill:'Hill Training','800s':'800m Repeats',long:'Long Run',fartlek:'Fartlek'};
const PN={capacity:'CAPACITY',velocity:'VELOCITY',outcome:'OUTCOME'};

// ===== PLAN GENERATION =====
function generatePlan(){
  const days=[];let n=0,cr=0;
  const add=(phase,pw,wd,session,dl=false)=>days.push({dayNum:++n,phase,phaseWeek:pw,weekDay:wd,session,isDeload:dl});
  for(let w=1;w<=8;w++){
    const dl=w===4||w===8;
    const sd=dl?'30':(w<=3?'30-60':'60-90'),ld=dl?'30':(w<=3?'60-90':'90-120');
    if(dl){
      add('capacity',w,1,{type:'upper',deload:true},true);
      add('capacity',w,2,{type:'run',runType:'lss',duration:sd,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Deload run. Easy effort throughout.'},true);
      add('capacity',w,3,{type:'rest'},true);
      add('capacity',w,4,{type:'run',runType:'lss',duration:sd,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Easy recovery run.'},true);
      add('capacity',w,5,{type:'rest'},true);
      add('capacity',w,6,{type:'run',runType:'lss',duration:ld,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Deload long run. Very easy throughout.'},true);
      add('capacity',w,7,{type:'rest'},true);
    } else {
      add('capacity',w,1,{type:'upper'});
      add('capacity',w,2,{type:'run',runType:'lss',duration:sd,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Aerobic base run. Target 120-150 BPM. If you cannot hold a conversation, slow down.'});
      add('capacity',w,3,{type:'lower'});
      add('capacity',w,4,{type:'run',runType:'lss',duration:sd,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Aerobic base run. Same effort as first run this week.'});
      add('capacity',w,5,{type:'upper'});
      add('capacity',w,6,{type:'run',runType:'lss',duration:ld,stravaLabel:`Capacity — Run ${++cr}/24`,notes:'Long aerobic run. Key session. Stay easy the entire time.'});
      add('capacity',w,7,{type:'rest'});
    }
  }
  const vW=[{ft:true,lss1:5,spd:'TPO',spdD:'3-5',lss2:3,lr:8},{ft:true,lss1:6,spd:'Hill',lss2:3,lr:9},{ft:true,lss1:6,spd:'800',spdD:'3-5',lss2:3,lr:10},{ft:false,lss1:3,lss2:3,lr:3,deload:true},{ft:true,lss1:6,spd:'TPO',spdD:'3-5',lss2:4,lr:11},{ft:true,lss1:8,spd:'Hill',lss2:4,lr:12},{ft:true,lss1:8,spd:'800',spdD:'3-5',lr:13,lr2:8},{ft:false,lss1:4,lss2:4,lr:4,deload:true}];
  let vFT=0;
  vW.forEach((v,i)=>{
    const w=i+1,dl=v.deload||false;
    if(v.ft){vFT++;add('velocity',w,1,{type:vFT%2===1?'upper':'lower'},dl);}else add('velocity',w,1,{type:'rest'},dl);
    add('velocity',w,2,{type:'run',runType:'lss',distance:v.lss1,notes:`Easy trail/road run. ${v.lss1} miles at comfortable aerobic pace.`},dl);
    if(v.spd==='TPO')add('velocity',w,3,{type:'run',runType:'tempo',distance:v.spdD,notes:`Tempo run ${v.spdD||''} miles. Add 1 mile warmup + cooldown.`},dl);
    else if(v.spd==='Hill')add('velocity',w,3,{type:'run',runType:'hill',notes:'Hill training: 30-120 min elevation work.'},dl);
    else if(v.spd==='800')add('velocity',w,3,{type:'run',runType:'800s',reps:v.spdD,notes:`800m repeats ×${v.spdD||''}. Full recovery between reps.`},dl);
    else add('velocity',w,3,{type:'rest'},dl);
    if(v.ft){vFT++;add('velocity',w,4,{type:vFT%2===1?'upper':'lower'},dl);}else add('velocity',w,4,{type:'rest'},dl);
    if(v.lss2)add('velocity',w,5,{type:'run',runType:'lss',distance:v.lss2,notes:`Easy recovery run. ${v.lss2} miles.`},dl);
    else add('velocity',w,5,{type:'rest'},dl);
    add('velocity',w,6,{type:'run',runType:'long',distance:v.lr,notes:`Long Run — ${v.lr} miles. Offroad preferred.`},dl);
    if(v.lr2)add('velocity',w,7,{type:'run',runType:'long',distance:v.lr2,notes:`Back-to-Back Long Run — ${v.lr2} miles.`},dl);
    else add('velocity',w,7,{type:'rest'},dl);
  });
  const oW=[{ft:true,r1:2,d5:'FK',r2:4},{ft:true,r1:2,d5:'Peggy',r2:5},{ft:true,r1:2,r2:6,r3:4},{deload:true},{se:true,r1:4,d5:'FK',r2:8},{se:true,r1:4,d5:'Peggy',r2:9},{se:true,r1:4,r2:10,r3:6},{deload:true}];
  let oFT=0;
  oW.forEach((v,i)=>{
    const w=i+1;
    if(v.deload){[1,3,5,7].forEach(d=>add('outcome',w,d,{type:'rest'},true));[2,4,6].forEach(d=>add('outcome',w,d,{type:'run',runType:'lss',notes:'Easy LSS, deload week.'},true));return;}
    const isSE=v.se||false;
    oFT++;add('outcome',w,1,{type:isSE?(oFT%2===1?'se_upper':'se_lower'):(oFT%2===1?'upper':'lower')});
    if(v.r1)add('outcome',w,2,{type:'ruck',distance:v.r1,notes:`Short Ruck — ${v.r1} miles. Start 15-20kg, build over weeks.`});
    add('outcome',w,3,{type:'run',runType:'lss',notes:'Easy LSS between rucks.'});
    oFT++;add('outcome',w,4,{type:isSE?(oFT%2===1?'se_upper':'se_lower'):(oFT%2===1?'upper':'lower')});
    if(v.d5==='FK')add('outcome',w,5,{type:'run',runType:'fartlek',distance:5,notes:'Fartlek 5 miles.'});
    else if(v.d5==='Peggy')add('outcome',w,5,{type:'run',runType:'hill',notes:"Peggy's Hills — 30-60 min elevation."});
    else add('outcome',w,5,{type:'rest'});
    if(v.r2)add('outcome',w,6,{type:'ruck',distance:v.r2,notes:`Long Ruck — ${v.r2} miles. Progressive weight increase.`});
    if(v.r3)add('outcome',w,7,{type:'ruck',distance:v.r3,notes:`Back-to-Back Ruck — ${v.r3} miles.`});
    else add('outcome',w,7,{type:'rest'});
  });
  return days;
}
const PLAN=generatePlan();

// ===== PROGRESSIVE OVERLOAD =====
function parseRR(r){if(!r||r==='Max')return{mn:6,mx:10};if(r.includes('-')){const[a,b]=r.split('-').map(Number);return{mn:a,mx:b};}const n=parseInt(r);return{mn:n,mx:n};}
function getInc(name){if(name==='Pull Ups')return-2.5;if(['DB Bench','DB Incline','T-Bar','Shoulder Press','Squat','Deadlift','Step Up'].some(c=>name.includes(c)))return 2.5;return 1;}
function getProgression(ex,ll){
  if(!ll)return null;
  const{mn,mx}=parseRR(ex.reps);
  const{weight:w,reps:r}=ll;
  const isPU=ex.name==='Pull Ups';
  if(r<mn)return{msg:`Keep ${w}kg${isPU?' assist':''} — aim for ${mn} reps`,color:'var(--text-dim)'};
  if(r<mx)return{msg:`Keep ${w}kg${isPU?' assist':''} — push to ${mx} reps`,color:'var(--amber)'};
  const nw=Math.round((w+getInc(ex.name))*10)/10;
  return{msg:isPU?`Reduce assist to ${nw}kg`:`Increase to ${nw}kg — great progress`,color:'var(--green)'};
}

// ===== DATE LOGIC =====
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
function getTodayPlanDay(){const e=daysBetween(STATE.startDate,todayISO());return Math.max(1,Math.min(PLAN.length,e+1-STATE.skippedDays));}
function isTodayMissed(){return(STATE.missedDates||[]).includes(todayISO());}
function getCurrentDay(){return PLAN[getTodayPlanDay()-1]||PLAN[0];}
function isCompleted(n){return STATE.completed.includes(n);}
function getPhaseTotal(p){return PLAN.filter(d=>d.phase===p).length;}
function getPhaseStart(p){return PLAN.findIndex(d=>d.phase===p)+1;}
function dayTypeLabel(d){if(!d)return'';const s=d.session;if(s.type==='run')return RTN[s.runType]||'Run';if(s.type==='ruck')return`Ruck ${s.distance||''}mi`;return SN[s.type]||s.type;}
function fmtTime(s){if(!s)return'--:--';const m=Math.floor(s/60),ss=s%60;return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function parseTime(str){if(!str)return null;const p=str.split(':').map(Number);if(p.length===2)return p[0]*60+p[1];if(p.length===3)return p[0]*3600+p[1]*60+p[2];return null;}
function getLastLog(name){const h=STATE.workoutHistory||[];for(let i=h.length-1;i>=0;i--){if(h[i].exercises&&h[i].exercises[name])return h[i].exercises[name];}return null;}
function fmtWt(ll){return ll.weightNote?`${ll.weight}kg (${ll.weightNote})`:`${ll.weight}kg`;}

function saveLog(planDayNum){
  const d=PLAN[planDayNum-1];if(!d)return;
  const exList=EXERCISES[d.session.type]||[];
  const exercises={};
  exList.forEach(ex=>{const id=ex.name.replace(/[^a-zA-Z0-9]/g,'_');const w=parseFloat(document.getElementById('lw_'+id)?.value);const r=parseInt(document.getElementById('lr_'+id)?.value);const s=parseInt(document.getElementById('ls_'+id)?.value);if(w&&r&&s)exercises[ex.name]={weight:w,reps:r,sets:s};});
  if(!STATE.workoutHistory)STATE.workoutHistory=[];
  STATE.workoutHistory.push({date:todayISO(),planDay:planDayNum,type:d.session.type,exercises});
  saveState();renderToday(planDayNum);
}

    html+=`<div style="font-size:20px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">${rt}</div><div class="card">`;

      html+=`<div class="run-row"><span style="color:var(--text-dim);">Type</span><span class="run-val">${RTN[s.runType]||s.runType}</span></div>`;
      if(s.duration)html+=`<div class="run-row"><span style="color:var(--text-dim);">Duration</span><span class="run-val">${s.duration} min</span></div>`;
      if(s.distance)html+=`<div class="run-row"><span style="color:var(--text-dim);">Distance</span><span class="run-val">${s.distance} miles</span></div>`;
      if(s.reps)html+=`<div class="run-row"><span style="color:var(--text-dim);">Reps</span><span class="run-val">${s.reps}×</span></div>`;
      if(s.runType==='lss')html+=`<div class="run-row"><span style="color:var(--text-dim);">HR Zone</span><span class="run-val">120-150 BPM</span></div><div class="run-row"><span style="color:var(--text-dim);">Target Pace</span><span class="run-val">~7:00 /km</span></div>`;
    } else {
      html+=`<div class="run-row"><span style="color:var(--text-dim);">Distance</span><span class="run-val">${s.distance} miles</span></div><div class="run-row"><span style="color:var(--text-dim);">Weight</span><span class="run-val">Progressive</span></div><div class="run-row"><span style="color:var(--text-dim);">Terrain</span><span class="run-val">Hilly preferred</span></div>`;
    }
    html+=`</div>`;
    if(s.stravaLabel){const sl=s.stravaLabel;html+=`<div class="strava"><div><div class="label" style="margin-bottom:2px;">Strava Label</div><div class="strava-text">${sl}</div></div><button class="strava-copy" onclick="navigator.clipboard.writeText('${sl}').then(()=>{this.textContent='COPIED';setTimeout(()=>this.textContent='COPY',1500)})">COPY</button></div>`;}
    if(s.notes)html+=`<div class="notes-box">${s.notes}</div>`;
  } else if(exList){
    html+=`<div style="font-size:14px;font-weight:600;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">${d.isDeload?'DELOAD — Reduce intensity ~40%':''}</div>`;

    html+=`<div class="notes-box">Progressive overload: when you hit the top of the rep range across all sets, increase weight next session. Bicep curls + hammer curls done at home as accessory.</div>`;
    html+=renderLogForm(exList,d.dayNum);
  }
  if(isToday&&!missed){
    if(done){html+=`<button class="btn done" onclick="markIncomplete()">✓ COMPLETED — TAP TO UNDO</button>`;
    } else if(s.type!=='rest'&&s.type!=='deload'){
      html+=`<button class="btn" onclick="markComplete()">MARK SESSION COMPLETE</button>`;
      html+=`<button class="btn miss" onclick="missSession()">⚠ MISSED SESSION — PUSH BACK 1 DAY</button>`;
    }
  } else if(viewDay&&!isToday){
    html+=`<button class="btn sec" onclick="jumpToDay(${d.dayNum})">SET AS CURRENT SESSION</button>`;

  document.getElementById('today-content').innerHTML=html;
}

  const ctx=cv.getContext('2d'),w=cv.offsetWidth||300,h=90;cv.width=w;cv.height=h;
  const pts=STATE.weights.slice(-20);
  if(pts.length<2){ctx.fillStyle='rgba(26,40,48,.5)';ctx.fillRect(0,0,w,h);ctx.fillStyle='#334050';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('Log weight to see trend',w/2,h/2+4);return;}
  const vals=pts.map(p=>parseFloat(p.value)),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1,r=mx-mn,pad=10,pw=w-pad*2,ph=h-pad*2;
  ctx.strokeStyle='#1a2830';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=pad+(i/3)*ph;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
  ctx.strokeStyle='#c8a84b';ctx.lineWidth=2;ctx.beginPath();
  pts.forEach((p,i)=>{const x=pad+(i/(pts.length-1))*pw,y=pad+((mx-parseFloat(p.value))/r)*ph;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  ctx.fillStyle='#c8a84b';pts.forEach((p,i)=>{const x=pad+(i/(pts.length-1))*pw,y=pad+((mx-parseFloat(p.value))/r)*ph;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#ddd5c0';ctx.font='10px monospace';ctx.textAlign='right';ctx.fillText(pts[pts.length-1].value+'kg',w-pad,pad+12);
}

// ===== ACTIONS =====
function markComplete(){const pd=getTodayPlanDay();if(!isCompleted(pd))STATE.completed.push(pd);saveState();renderToday();renderDash();}
function markIncomplete(){STATE.completed=STATE.completed.filter(n=>n!==getTodayPlanDay());saveState();renderToday();renderDash();}
function missSession(){const t=todayISO();if(!STATE.missedDates)STATE.missedDates=[];if(!STATE.missedDates.includes(t))STATE.missedDates.push(t);STATE.skippedDays++;saveState();renderToday();renderDash();}
function viewDay(n){renderToday(n);showPage('today');document.getElementById('pg-today').scrollTop=0;}
function jumpToDay(n){const e=daysBetween(STATE.startDate,todayISO());STATE.skippedDays=e+1-n;saveState();renderToday();renderDash();}
function logWeight(){const v=document.getElementById('inp-wt').value,date=document.getElementById('inp-wt-date').value;if(!v)return;STATE.weights.push({date,value:parseFloat(v).toFixed(1)});saveState();renderStats();}
function logRun(){const dist=document.getElementById('inp-dist').value,secs=parseTime(document.getElementById('inp-time').value);if(!secs)return;if(!STATE.runs)STATE.runs=[];STATE.runs.push({date:todayISO(),dist,secs});if(!STATE.pbs[dist]||secs<STATE.pbs[dist])STATE.pbs[dist]=secs;saveState();renderStats();}
function setPB(dist){const t=prompt(`PB for ${dist} (mm:ss):`);if(!t)return;const s=parseTime(t.trim());if(s){STATE.pbs[dist]=s;saveState();renderStats();}}
function updateStart(){const v=document.getElementById('inp-start').value;if(!v)return;STATE.startDate=v;STATE.skippedDays=0;STATE.missedDates=[];saveState();renderStats();renderDash();}

// ===== NAV =====
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  const idx=['dash','today','plan','stats'].indexOf(name);
  document.querySelectorAll('.nb')[idx].classList.add('active');
  if(name==='dash')renderDash();else if(name==='today')renderToday();else if(name==='plan')renderPlan();else if(name==='stats')renderStats();
}
renderDash();
</script>
